# Shared http-level settings for the IDEKube gateway. conf.d/*.conf is
# included before sites-enabled/*, whose server block relies on these.

# Access log without the query string: token links carry the access token
# in ?idekube-container-access-token=..., which must not be written to disk.
# The path is taken from the original request line ($uri would show internal
# rewrites such as /_idekube_set_cookie or /401.html instead). Each server
# block selects this format with its own access_log directive.
map $request_uri $__idekube_log_path {
    default        "-";
    "~^(?<p>[^?]*)" $p;
}
log_format idekube_redacted '$remote_addr - $remote_user [$time_local] '
                            '"$request_method $__idekube_log_path $server_protocol" '
                            '$status $body_bytes_sent "$http_referer" "$http_user_agent"';

# Mark the access-token cookie Secure only when the browser-facing hop is
# HTTPS (TLS terminates at the ingress, which sets X-Forwarded-Proto), so
# plain-HTTP access on localhost or a LAN keeps working.
map $http_x_forwarded_proto $__idekube_cookie_secure {
    default "";
    https   "; Secure";
}

# Redirect target after the token cookie is set: the path exactly as the client
# sent it, minus the query string that carried the token. Using the raw path
# keeps percent-encoding intact, so "%5c" or "%0d%0a" stay inert instead of
# being decoded into a backslash or a header break. The path must start with a
# single "/" not followed by "/" or "\" (browsers would read either as another
# host) and contain only printable ASCII; anything else falls back to "/".
map $request_uri $__idekube_redirect_path {
    default                                                    /;
    "~^(?<path>/(?![/\\\\])[\x21-\x3e\x40-\x7e]*)(?:\?|$)"    $path;
}

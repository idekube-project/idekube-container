---
- name: Install Kathara and Network Tools
  hosts: localhost
  become: yes
  vars:
    docker_compose_version: "v2.29.2"
    docker_major_version: "28"
    netcap_version: "v0.6.11"
    docker_registry: "docker.io"
    kathara_images:
      - kathara/base
      - kathara/frr
      - kathara/quagga
      - kathara/pox
      - kathara/sdn

  tasks:
    - name: Update apt cache
      apt:
        update_cache: yes
        cache_valid_time: 3600

    - name: Install required system packages
      apt:
        name:
          - ca-certificates
          - curl
          - gnupg
          - lsb-release
          - apt-transport-https
          - software-properties-common
          - git
          - wget
        state: present

    - name: Setup Docker
      block:
        - name: Ensure apt keyrings directory
          file:
            path: /etc/apt/keyrings
            state: directory
            mode: '0755'

        - name: Add Docker apt signing key
          get_url:
            url: https://download.docker.com/linux/ubuntu/gpg
            dest: /etc/apt/keyrings/docker.asc
            mode: '0644'
            force: true
          register: docker_key
          until: docker_key is succeeded
          retries: 5
          delay: 10

        - name: Detect dpkg architecture
          command: dpkg --print-architecture
          register: dpkg_arch
          changed_when: false

        - name: Add Docker apt repository
          apt_repository:
            repo: "deb [arch={{ dpkg_arch.stdout }} signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable"
            state: present
            filename: docker
            update_cache: yes

        - name: Resolve latest Docker v{{ docker_major_version }} package version
          shell: |
            set -o pipefail
            apt-cache madison docker-ce | awk '$3 ~ /^5:{{ docker_major_version }}\./ {print $3; exit}'
          args:
            executable: /bin/bash
          register: docker_ce_version
          changed_when: false
          failed_when: docker_ce_version.stdout | trim == ""

        # Keep dpkg postinst from starting docker/containerd while the image is
        # built: nothing needs them yet, and dockerd would create docker0 with
        # its default 172.17.0.1/16 (see "Docker address ranges" below for why
        # that address matters). The units stay enabled for runtime boots.
        - name: Install policy-rc.d to block service auto-start
          copy:
            dest: /usr/sbin/policy-rc.d
            mode: '0755'
            content: |
              #!/bin/sh
              exit 101

        - name: Install Docker v{{ docker_major_version }} packages
          apt:
            name:
              - "docker-ce={{ docker_ce_version.stdout }}"
              - "docker-ce-cli={{ docker_ce_version.stdout }}"
              - containerd.io
              - docker-buildx-plugin
              - docker-compose-plugin
            state: present
            update_cache: no
          environment:
            DEBIAN_FRONTEND: noninteractive
            NEEDRESTART_MODE: a
            NEEDRESTART_SUSPEND: "1"

        - name: Remove policy-rc.d
          file:
            path: /usr/sbin/policy-rc.d
            state: absent

        - name: Add idekube user to docker group
          user:
            name: "idekube"
            groups: docker
            append: yes

    # Docker address ranges. Docker's default 172.17.0.0/16 (and its default
    # pools) overlap networks the VM must reach or receive traffic from: the
    # outer Docker bridge and Kubernetes pod/service ranges. Before the QEMU
    # container relayed forwarded ports through loopback, a connection from
    # 172.17.0.1 even became a martian once docker0 took that address, and
    # every forwarded SSH/HTTP connection died ~12 s into boot.
    # idekube-docker-network writes bip and default-address-pools from
    # IDEKUBE_VM_DOCKER_BIP / IDEKUBE_VM_DOCKER_ADDRESS_POOLS (defaults
    # 10.213.0.1/24 and 10.214.0.0/16:24) before dockerd starts, every boot.
    - name: Docker address ranges from the runtime environment
      block:
        - name: Install idekube-docker-network
          copy:
            src: files/idekube-docker-network
            dest: /usr/local/sbin/idekube-docker-network
            mode: '0755'
        - name: Install idekube-docker-network.service
          copy:
            src: files/idekube-docker-network.service
            dest: /etc/systemd/system/idekube-docker-network.service
            mode: '0644'
        - name: Create docker.service drop-in directory
          file:
            path: /etc/systemd/system/docker.service.d
            state: directory
            mode: '0755'
        - name: Order docker.service after idekube-docker-network
          copy:
            src: files/docker-idekube-network.conf
            dest: /etc/systemd/system/docker.service.d/10-idekube-network.conf
            mode: '0644'
        - name: Enable idekube-docker-network
          systemd:
            name: idekube-docker-network
            enabled: yes
            daemon_reload: yes

    - name: Setup Kathara (amd64 only)
      block:
        - name: Add Kathara PPA
          apt_repository:
            repo: ppa:katharaframework/kathara
            state: present

        - name: Install Kathara and network tools
          apt:
            name:
              - kathara
            state: present
            update_cache: yes
      when: ansible_architecture == "x86_64"

    - name: Install network tools
      apt:
        name:
          - nano
          - gedit
          - xterm
          - wireshark
          - iperf
          - iperf3
          - netcat-traditional
          - tcpdump
        state: present
        update_cache: yes

    - name: Setup netcap (amd64 only)
      block:
        - name: Download netcap
          get_url:
            url: "https://github.com/dreadl0ck/netcap/releases/download/{{ netcap_version }}/netcap_{{ netcap_version }}_linux_amd64_libc.tar.gz"
            dest: /tmp/netcap.tar.gz
            mode: '0644'

        - name: Extract netcap
          unarchive:
            src: /tmp/netcap.tar.gz
            dest: /tmp
            remote_src: yes

        - name: Install netcap binary
          copy:
            src: "/tmp/netcap_{{ netcap_version }}_linux_amd64_libc/net"
            dest: /usr/bin/net
            mode: '0755'
            remote_src: yes

        - name: Clean up netcap download
          file:
            path: "{{ item }}"
            state: absent
          loop:
            - /tmp/netcap.tar.gz
            - "/tmp/netcap_{{ netcap_version }}_linux_amd64_libc"
      when: ansible_architecture == "x86_64"

    - name: Setup Kathara Labs and Docker configuration
      block:
        - name: Clone Kathara Labs repository
          git:
            repo: https://github.com/KatharaFramework/Kathara-Labs.git
            dest: /opt/Kathara-Labs
            version: main
        # - name: Start and enable Docker service
        #   systemd:
        #     name: docker
        #     state: started
        #     enabled: yes
        # - name: Pull Kathara Docker images
        #   docker_image:
        #     name: "{{ docker_registry }}/{{ item }}"
        #     source: pull
        #   loop: "{{ kathara_images }}"

    - name: Clean up
      block:
      - name: Clean apt cache
        apt:
          autoclean: yes
          autoremove: yes
      - name: Remove temporary files
        shell:
          rm -rf /tmp/*
      - name: Replace Home Directory with /etc/skel/
        shell:
          rsync -a --delete /etc/skel/ /home/idekube/
        ignore_errors: yes

    # Clean cloud-init state so it re-runs on first runtime boot
    - name: Clean cloud-init state
      shell: cloud-init clean --logs
      ignore_errors: yes

# Server-level configuration shared by every IDEKUBE image. Each image's
# sites-enabled/default is `server { include snippets/idekube-server.conf; ... }`
# plus its own locations. Relies on the http-level maps in
# conf.d/idekube-common.conf and conf.d/access_token.conf.

listen 80;
listen [::]:80;
client_max_body_size 0;

# TLS terminates at the ingress, so $scheme here is always "http".
# Emit relative Location headers and let the browser resolve them
# against the page URL; absolute ones would downgrade HTTPS to HTTP.
absolute_redirect off;

# Log format without the query string (see conf.d/idekube-common.conf):
# token links would otherwise write the access token to disk.
access_log /var/log/nginx/access.log idekube_redacted;

# When the token arrives as a query parameter, rewrite to an internal
# endpoint that sets the cookie and redirects to $__idekube_redirect_path
# (conf.d/idekube-common.conf). "add_header" is not allowed in a
# server-level "if", hence the internal location.
if ($__idekube_token_arg_ok = 1) {
    rewrite ^ /_idekube_set_cookie last;
}

error_page 401 /401.html;
error_page 404 @fallback_to_home;
location = /401.html {
    internal;
    root /usr/share/nginx/html;
}
location @fallback_to_home {
    return 302 /;
}

# The landing page ships no favicon. Answer the browser's automatic
# probe directly instead of routing it through the 404 fallback.
location = /favicon.ico {
    access_log off;
    return 204;
}

# Persist the query-parameter token as a cookie, then redirect to the clean path.
location = /_idekube_set_cookie {
    internal;
    add_header Set-Cookie "idekube_container_access_token=$__idekube_token_from_arg; Path=/; Max-Age=86400; SameSite=Lax; HttpOnly$__idekube_cookie_secure";
    return 302 $__idekube_redirect_path?;
}

# Internal auth check for auth_request: 200 when access is permitted, 401
# otherwise. auth_request instead of "if" inside proxied locations keeps
# proxy_pass and WebSocket upgrades intact ("if is evil" in nginx).
location = /_idekube_auth {
    internal;
    if ($idekube_access_permitted = 1) {
        return 200;
    }
    return 401;
}

# SSH via Websocat (excluded from token auth: SSH public-key auth)
location = /ssh {
    proxy_pass http://127.0.0.1:2222/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 86400;
}
location = /ssh/ {
    proxy_pass http://127.0.0.1:2222/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 86400;
}

# Health check endpoint (no auth: Kubernetes probes)
location = /health {
    proxy_pass http://127.0.0.1:9999/;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
}

# Landing page
location = / {
    auth_request /_idekube_auth;
    root /usr/share/nginx/html;
    index index.html;
}

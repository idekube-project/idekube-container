name: setup-docker-buildx
description: Setup QEMU and Buildx, and optionally log in to GHCR
inputs:
  login:
    description: Whether to login to ghcr.io
    required: false
    default: 'true'
  username:
    description: Username for ghcr.io login
    required: false
  password:
    description: Password/token for ghcr.io login
    required: false
runs:
  using: composite
  steps:
    - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
    - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
    - if: inputs.login == 'true'
      uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
      with:
        registry: ghcr.io
        username: ${{ inputs.username }}
        password: ${{ inputs.password }}

name: run-tests
description: >-
  Run the pytest/Playwright suite (tests/) against images that are already
  loaded or that it pulls from the registry. Fails when an image is missing or
  when no test passed (--require-images), so a run that tested nothing is
  never green.
inputs:
  branches:
    description: Comma-separated branches, e.g. coder/base,coder/conda
    required: true
  lineup:
    description: universal or ascend
    required: false
    default: universal
  version:
    description: VERSION the images were tagged with (bake's VERSION)
    required: true
  staging-postfix:
    description: '"-staging" for candidates, empty for locally loaded images'
    required: false
    default: ""
  pull:
    description: '"true" to docker pull the images first'
    required: false
    default: "false"
  workers:
    description: pytest-xdist workers (branches run one per worker)
    required: false
    default: "2"
  artifact-name:
    description: Name of the artifact that receives logs and screenshots on failure
    required: true
runs:
  using: composite
  steps:
    - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      with:
        enable-cache: true
        cache-dependency-glob: tests/uv.lock

    - name: Install test dependencies
      shell: bash
      working-directory: tests
      run: |
        uv sync --frozen
        uv run playwright install --with-deps chromium

    - name: Pull images
      if: inputs.pull == 'true'
      shell: bash
      working-directory: tests
      env:
        BRANCHES: ${{ inputs.branches }}
        LINEUP: ${{ inputs.lineup }}
        VERSION: ${{ inputs.version }}
        STAGING_POSTFIX: ${{ inputs.staging-postfix }}
      run: |
        set -euo pipefail
        # Same resolution the tests use, so the pulled refs are the tested refs.
        uv run python -c '
        import os
        from helpers.images import resolve_image_ref
        for branch in os.environ["BRANCHES"].split(","):
            print(resolve_image_ref(branch, os.environ["LINEUP"]))
        ' | while read -r ref; do
          echo "::group::docker pull $ref"
          docker pull "$ref"
          echo "::endgroup::"
        done

    - name: Run tests
      shell: bash
      working-directory: tests
      env:
        BRANCHES: ${{ inputs.branches }}
        LINEUP: ${{ inputs.lineup }}
        VERSION: ${{ inputs.version }}
        STAGING_POSTFIX: ${{ inputs.staging-postfix }}
        WORKERS: ${{ inputs.workers }}
      run: |
        uv run pytest \
          --lineup "$LINEUP" --branch "$BRANCHES" --require-images \
          -n "$WORKERS" --dist loadgroup \
          --output-dir "$RUNNER_TEMP/test-output" \
          --junitxml "$RUNNER_TEMP/test-output/junit.xml" \
          -p no:cacheprovider -rfE

    - name: Upload test output
      if: failure()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: ${{ inputs.artifact-name }}
        path: ${{ runner.temp }}/test-output
        retention-days: 7

# Actions are pinned to commit SHAs (with the version in a trailing comment);
# Dependabot keeps both up to date.
version: 2
updates:
  - package-ecosystem: github-actions
    directories:
      - "/"
      - "/.github/actions/setup-docker-buildx"
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]

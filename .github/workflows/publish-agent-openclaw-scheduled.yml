name: publish-agent-openclaw-scheduled

on:
  schedule:
    - cron: '0 */12 * * *'
  workflow_dispatch:

jobs:
  publish-openclaw:
    concurrency:
      group: publish-agent-openclaw-scheduled
      cancel-in-progress: false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      OPENCLAW_REPO: openclaw/openclaw
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Resolve latest OpenClaw release metadata
        id: openclaw
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          # image_version tracks the idekube-container meta-repo's latest git tag,
          # matching the convention used by publish-production.yml. Upstream OpenClaw
          # release tags are date-based and would otherwise duplicate openclaw_version.
          image_version="$(git describe --tags --abbrev=0 2>/dev/null || true)"
          if [[ -z "$image_version" ]]; then
            echo "Unable to resolve idekube-container git tag. Create a git tag first." >&2
            exit 1
          fi

          release_json="$(curl -fsSL -H 'Accept: application/vnd.github+json' -H "Authorization: Bearer $GH_TOKEN" "https://api.github.com/repos/${OPENCLAW_REPO}/releases/latest")"

          release_name="$(jq -r '.name // empty' <<<"$release_json")"
          release_tag="$(jq -r '.tag_name // empty' <<<"$release_json")"

          # Upstream may format release titles differently over time.
          # Extract the first 20xx.x.x token from name first, then tag.
          openclaw_version="$(printf '%s\n%s\n' "$release_name" "$release_tag" | grep -Eo '20[0-9]{2}\.[0-9]{1,2}\.[0-9]{1,2}' | head -n1 || true)"
          if [[ ! "$openclaw_version" =~ ^[0-9]{4}\.[0-9]{1,2}\.[0-9]{1,2}$ ]]; then
            echo "Unable to extract upstream OpenClaw version (20xx.x.x) from release name/tag. name='$release_name' tag='$release_tag'." >&2
            exit 1
          fi

          full_version="${image_version}-${openclaw_version}"

          echo "image_version=$image_version" >> "$GITHUB_OUTPUT"
          echo "openclaw_version=$openclaw_version" >> "$GITHUB_OUTPUT"
          echo "full_version=$full_version" >> "$GITHUB_OUTPUT"

      - name: Setup Docker build environment
        uses: ./.github/actions/setup-docker-buildx
        with:
          login: 'true'
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Decide which lineups need publishing
        id: decide
        run: |
          set +e
          base="ghcr.io/idekube-project/idekube-container-agent:openclaw-${{ steps.openclaw.outputs.full_version }}"
          docker buildx imagetools inspect "$base"         >/dev/null 2>&1; universal_found=$?
          docker buildx imagetools inspect "${base}-ascend" >/dev/null 2>&1; ascend_found=$?
          set -e

          targets=()
          [[ "$universal_found" -ne 0 ]] && targets+=("agent-openclaw-universal")
          [[ "$ascend_found"    -ne 0 ]] && targets+=("agent-openclaw-ascend")

          joined="$(IFS=,; echo "${targets[*]:-}")"
          echo "universal_exists=$([[ "$universal_found" -eq 0 ]] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "ascend_exists=$([[ "$ascend_found" -eq 0 ]] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "targets=$joined" >> "$GITHUB_OUTPUT"

          if [[ -z "$joined" ]]; then
            echo "Both lineup tags already exist; nothing to publish."
          else
            echo "Will build: $joined"
          fi

      # Skip the agent-base rebuild: this job only layers a new OpenClaw
      # version. Rebuilding agent-base-ascend under QEMU on ubuntu-latest
      # hits a libc-bin/ldconfig segfault (dpkg exit 139, apt 100).
      - name: Build and push agent-openclaw
        if: steps.decide.outputs.targets != ''
        uses: docker/bake-action@v7
        env:
          VERSION: ${{ steps.openclaw.outputs.full_version }}
          OPENCLAW_VERSION: ${{ steps.openclaw.outputs.openclaw_version }}
          STABLE_TAG: ${{ steps.openclaw.outputs.image_version }}
        with:
          files: |
            docker-bake.hcl
            docker-bake.skip-base.hcl
          targets: ${{ steps.decide.outputs.targets }}
          push: true

      - name: Summary
        run: |
          base="ghcr.io/idekube-project/idekube-container-agent:openclaw-${{ steps.openclaw.outputs.full_version }}"
          if [[ -z "${{ steps.decide.outputs.targets }}" ]]; then
            echo "Both lineup tags already exist; nothing to do." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Published targets: ${{ steps.decide.outputs.targets }}" >> "$GITHUB_STEP_SUMMARY"
            [[ "${{ steps.decide.outputs.universal_exists }}" == "false" ]] && echo "- $base" >> "$GITHUB_STEP_SUMMARY"
            [[ "${{ steps.decide.outputs.ascend_exists }}"    == "false" ]] && echo "- ${base}-ascend" >> "$GITHUB_STEP_SUMMARY"
            echo "OPENCLAW_VERSION=${{ steps.openclaw.outputs.openclaw_version }}" >> "$GITHUB_STEP_SUMMARY"
          fi

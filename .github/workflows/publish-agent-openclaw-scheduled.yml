name: publish-agent-openclaw-scheduled

# OpenClaw fast lane: when upstream publishes a new OpenClaw, rebuild only
# agent-openclaw (both lineups) from the latest *release* (never from main,
# whose base images may not be released yet), test it like any candidate,
# and promote it to openclaw-<release>-<openclaw> only if the tests pass.
#
# The release must have been cut with the candidate pipeline (it carries
# scripts/ci/bakeplan.py); older releases are skipped. Renovate separately
# bumps OPENCLAW_VERSION in docker-bake.hcl for the next regular release.

on:
  schedule:
    - cron: '0 */12 * * *'
  workflow_dispatch:

concurrency:
  group: publish-agent-openclaw-scheduled
  cancel-in-progress: false

jobs:
  resolve:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    outputs:
      build: ${{ steps.plan.outputs.build }}
      tag: ${{ steps.plan.outputs.tag }}
      openclaw: ${{ steps.plan.outputs.openclaw }}
      version: ${{ steps.plan.outputs.version }}
    steps:
      - name: Latest release and OpenClaw version
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          tag=$(gh api "repos/$REPO/releases/latest" --jq .tag_name)
          # Anyone who can publish a release controls this string; it ends up
          # in image tags, so only accept Docker tag characters.
          if [[ ! "$tag" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,100}$ ]]; then
            echo "::error::release tag '$tag' is not a valid image tag component"; exit 1
          fi
          if ! gh api "repos/$REPO/contents/scripts/ci/bakeplan.py?ref=$tag" >/dev/null 2>&1; then
            echo "::notice::Release $tag predates the candidate pipeline; nothing to do."
            echo "build=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          openclaw=$(npm view openclaw version)
          if [[ ! "$openclaw" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::unexpected OpenClaw version '$openclaw'"; exit 1
          fi
          version="${tag}-${openclaw}"
          image="ghcr.io/${REPO,,}-agent:openclaw-${version}"
          build=false
          for ref in "$image" "${image}-ascend"; do
            docker buildx imagetools inspect "$ref" >/dev/null 2>&1 || build=true
          done
          {
            echo "build=$build"
            echo "tag=$tag"
            echo "openclaw=$openclaw"
            echo "version=$version"
          } >> "$GITHUB_OUTPUT"
          echo "release $tag, OpenClaw $openclaw -> openclaw-$version (build=$build)" | tee -a "$GITHUB_STEP_SUMMARY"

  build:
    needs: resolve
    if: needs.resolve.outputs.build == 'true'
    uses: ./.github/workflows/_build.yml
    permissions:
      contents: read
      packages: write
    with:
      ref: refs/tags/${{ needs.resolve.outputs.tag }}
      version: ${{ needs.resolve.outputs.version }}
      targets: agent-openclaw-all
      skip_base: true
      base_tag: ${{ needs.resolve.outputs.tag }}
      base_tag_ascend: ${{ needs.resolve.outputs.tag }}-ascend
      openclaw_version: ${{ needs.resolve.outputs.openclaw }}
      artifact_prefix: openclaw

  promote:
    needs: [resolve, build]
    if: needs.build.outputs.tests == 'passed'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: refs/tags/${{ needs.resolve.outputs.tag }}
      - uses: ./.github/actions/setup-docker-buildx
        with:
          login: 'true'
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          qemu: 'false'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: openclaw-candidate
      - name: Promote tested OpenClaw images
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
        run: ./scripts/ci/bakeplan.py promote --candidate candidate.json --version "$VERSION" --expect-sha "$(git rev-parse HEAD)"

name: publish-production

# Promotes a tested release candidate; nothing is built here. The digests in
# the release's candidate.json (written by publish-staging) are retagged with
# the release tags, so production ships exactly the bits staging tested.
#
#   1. gh release create vX.Y.Z --prerelease       -> publish-staging builds
#                                                     and tests the candidate
#   2. gh release edit vX.Y.Z --prerelease=false    -> this workflow promotes
#
# Releases created with the workflow GITHUB_TOKEN trigger no workflows, so
# create them with your own gh login. See CLAUDE.md ("Releasing").

on:
  release:
    types: [released]
  workflow_dispatch:
    inputs:
      version:
        description: "Release tag to promote (its release must carry candidate.json)."
        required: true
        type: string
      targets:
        description: "Only these bake targets/groups (comma-separated). Empty = the whole candidate. Skips the stable aliases."
        required: false
        type: string
        default: ""
      dry_run:
        description: "Check the candidate and print the retags without pushing."
        required: false
        type: boolean
        default: false
      force:
        description: "Overwrite release tags that already point to other digests."
        required: false
        type: boolean
        default: false

concurrency:
  group: publish-production-${{ github.event.release.tag_name || inputs.version }}
  cancel-in-progress: false

jobs:
  promote:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      # Tooling comes from the workflow's own ref (the release tag on release
      # events, the chosen branch on dispatch); the tag only names the commit
      # the candidate must have been built from. That keeps dry runs against
      # tags older than this tooling possible.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Setup Docker build environment
        uses: ./.github/actions/setup-docker-buildx
        with:
          login: true
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve version
        id: vars
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_TARGETS: ${{ inputs.targets }}
        run: |
          if [[ "$EVENT_NAME" == "release" ]]; then
            VERSION="$RELEASE_TAG"
          else
            VERSION="$INPUT_VERSION"
          fi
          if [[ ! "$VERSION" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]]; then
            echo "::error::VERSION '$VERSION' is not a valid image tag." >&2
            exit 1
          fi
          if [[ -n "$INPUT_TARGETS" && ! "$INPUT_TARGETS" =~ ^[a-z0-9][a-z0-9-]*(,[a-z0-9][a-z0-9-]*)*$ ]]; then
            echo "::error::targets must be comma-separated bake target/group names, got '$INPUT_TARGETS'" >&2
            exit 1
          fi
          if ! SHA=$(git rev-parse --verify --quiet "refs/tags/${VERSION}^{commit}"); then
            echo "::error::No git tag named $VERSION." >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

      - name: Fetch candidate.json
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.vars.outputs.version }}
          SHA: ${{ steps.vars.outputs.sha }}
          DRY_RUN: ${{ inputs.dry_run == true }}
        run: |
          if gh release download "$VERSION" --pattern candidate.json --clobber; then
            jq '{version, sha, created, source, tests, images: (.images | length)}' candidate.json
            exit 0
          fi
          if [[ "$DRY_RUN" == true ]]; then
            # Rehearsal only: describe whatever the -staging tags hold now.
            # The promotion step reports why it would refuse this candidate.
            echo "::warning::release $VERSION has no candidate.json; dry run uses the current -staging tags instead."
            ./scripts/ci/bakeplan.py candidate --version "$VERSION" --sha "$SHA" --targets universal,ascend --out candidate.json
            exit 0
          fi
          echo "::error::Release $VERSION has no candidate.json, so there is no tested build to promote. Publish it as a prerelease first (publish-staging builds and tests it), or dispatch publish-staging with version=$VERSION, then re-run this workflow." >&2
          exit 1

      - name: Promote candidate digests
        env:
          VERSION: ${{ steps.vars.outputs.version }}
          SHA: ${{ steps.vars.outputs.sha }}
          INPUT_TARGETS: ${{ inputs.targets }}
          DRY_RUN: ${{ inputs.dry_run == true }}
          FORCE: ${{ inputs.force == true }}
        run: |
          args=(promote --candidate candidate.json --version "$VERSION" --expect-sha "$SHA")
          [[ -n "$INPUT_TARGETS" ]] && args+=(--targets "$INPUT_TARGETS")
          [[ "$DRY_RUN" == true ]] && args+=(--dry-run)
          [[ "$FORCE" == true ]] && args+=(--force)
          ./scripts/ci/bakeplan.py "${args[@]}"

      # Base repos get stable / stable-ascend aliases (derived images FROM the
      # base's stable tag). Only for the latest release, so re-promoting an
      # older version never moves stable backwards.
      - name: Tag stable
        if: inputs.targets == '' && inputs.dry_run != true
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.vars.outputs.version }}
        run: |
          latest=$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest" --jq .tag_name)
          if [[ "$latest" != "$VERSION" ]]; then
            echo "Latest release is $latest, not $VERSION; leaving stable aliases alone." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          for branch in featured/base coder/base jupyter/base agent/base; do
            ./scripts/tag-stable.sh "$branch" "$VERSION" all
          done

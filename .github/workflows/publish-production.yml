name: publish-production

on:
  release:
    types: [released]
  workflow_dispatch:
    inputs:
      version:
        description: "Image version tag. Defaults to the latest reachable git tag."
        required: false
        type: string
      lineup:
        description: "universal, ascend, or both"
        required: false
        type: choice
        options: [universal, ascend, both]
        default: both
      targets:
        description: "Bake target/group (e.g. agent-base-ascend, agent-base-all, agent). Empty = full lineup. Run 'make discover GROUP=universal' to list targets. Note: tag-stable is skipped when this is set."
        required: false
        type: string
        default: ""

jobs:
  publish:
    name: ${{ matrix.lineup }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        lineup: [universal, ascend]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      # Matrix-leg routing:
      #   - targets set      -> run universal leg only (the default leg). The
      #                         job builds whatever the targets value resolves
      #                         to inside bake; the leg label is purely the
      #                         runner-job slot, not a filter on what's built.
      #                         Ascend images can still be produced when the
      #                         requested group contains ascend targets (e.g.
      #                         agent-ascend, agent-base-all).
      #   - targets empty    -> lineup input controls (both / universal / ascend).
      - name: Route matrix leg (targets overrides lineup)
        if: ${{ github.event_name == 'workflow_dispatch' && ( (github.event.inputs.targets != '' && matrix.lineup != 'universal') || (github.event.inputs.targets == '' && github.event.inputs.lineup != 'both' && github.event.inputs.lineup != matrix.lineup) ) }}
        run: |
          echo "Skipping ${{ matrix.lineup }} (targets='${{ github.event.inputs.targets }}', lineup='${{ github.event.inputs.lineup }}')"
          echo "SKIP=1" >> "$GITHUB_ENV"

      - name: Setup Docker build environment
        if: env.SKIP != '1'
        uses: ./.github/actions/setup-docker-buildx
        with:
          login: 'true'
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve production version
        id: vars
        if: env.SKIP != '1'
        run: |
          if [[ "${{ github.event_name }}" == "release" ]]; then
            VERSION="${{ github.event.release.tag_name }}"
          elif [[ -n "${{ github.event.inputs.version }}" ]]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="$(git describe --tags --abbrev=0 2>/dev/null || true)"
          fi

          if [[ -z "$VERSION" ]]; then
            echo "Unable to determine production VERSION. Provide the dispatch version input or create a git tag first." >&2
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Version=$VERSION"

      - name: Build and push production images (${{ matrix.lineup }})
        if: env.SKIP != '1'
        uses: docker/bake-action@v7
        env:
          VERSION: ${{ steps.vars.outputs.version }}
        with:
          files: docker-bake.hcl,docker-bake.production.hcl
          targets: ${{ github.event.inputs.targets || matrix.lineup }}
          push: true

      - name: Tag stable
        if: env.SKIP != '1' && github.event.inputs.targets == ''
        env:
          VERSION: ${{ steps.vars.outputs.version }}
          LINEUP: ${{ matrix.lineup }}
        run: |
          # Retag every base repo's release tag as stable for this lineup only.
          # Derived repos do not get stable aliases (they FROM the base stable).
          base_branches="featured/base coder/base jupyter/base agent/base"
          for branch in $base_branches; do
            if [[ "${{ matrix.lineup }}" == "ascend" ]] && [[ "$branch" != "featured/base" ]] && [[ "$branch" != "jupyter/base" ]] && [[ "$branch" != "agent/base" ]]; then
              continue
            fi
            ./scripts/tag-stable.sh "$branch" "$VERSION" "$LINEUP"
          done

      - name: Skip tag-stable for scoped build
        if: env.SKIP != '1' && github.event.inputs.targets != ''
        run: |
          echo "Custom targets='${{ github.event.inputs.targets }}' — skipping tag-stable."
          echo "Run scripts/tag-stable.sh manually if a stable alias is needed."

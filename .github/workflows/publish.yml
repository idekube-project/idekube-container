name: publish-staging

on:
  release:
    types: [prereleased]
  workflow_dispatch:
    inputs:
      lineup:
        description: "universal, ascend, or both"
        required: false
        type: choice
        options: [universal, ascend, both]
        default: both
      targets:
        description: "Bake target/group (e.g. agent-base-ascend, agent-base-all, agent). Empty = full lineup. Run 'make discover GROUP=universal' to list targets."
        required: false
        type: string
        default: ""
      skip_base:
        description: "Skip base-image rebuild — derived targets pull :stable from the registry instead."
        required: false
        type: boolean
        default: false
      base_tag:
        description: "Universal base image tag when skip_base is enabled (e.g. stable, v0.8.3, edge-staging)."
        required: false
        type: string
        default: "stable"
      base_tag_ascend:
        description: "Ascend base image tag when skip_base is enabled. Empty = base_tag + '-ascend'."
        required: false
        type: string
        default: ""

jobs:
  publish:
    name: ${{ matrix.lineup }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        lineup: [universal, ascend]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      # Matrix-leg routing:
      #   - targets set      -> run universal leg only (the default leg). The
      #                         job builds whatever the targets value resolves
      #                         to inside bake; the leg label is purely the
      #                         runner-job slot, not a filter on what's built.
      #                         Ascend images can still be produced when the
      #                         requested group contains ascend targets (e.g.
      #                         agent-ascend, agent-base-all).
      #   - targets empty    -> lineup input controls (both / universal / ascend).
      - name: Route matrix leg (targets overrides lineup)
        if: ${{ github.event_name == 'workflow_dispatch' && ( (github.event.inputs.targets != '' && matrix.lineup != 'universal') || (github.event.inputs.targets == '' && github.event.inputs.lineup != 'both' && github.event.inputs.lineup != matrix.lineup) ) }}
        run: |
          echo "Skipping ${{ matrix.lineup }} (targets='${{ github.event.inputs.targets }}', lineup='${{ github.event.inputs.lineup }}')"
          echo "SKIP=1" >> $GITHUB_ENV

      - name: Setup Docker build environment
        if: env.SKIP != '1'
        uses: ./.github/actions/setup-docker-buildx
        with:
          login: true
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve staging version
        id: vars
        if: env.SKIP != '1'
        run: |
          if [[ "${{ github.event_name }}" == "release" ]]; then
            VERSION="${{ github.event.release.tag_name }}"
          else
            VERSION="${GITHUB_SHA::7}"
          fi
          FRONTEND_HASH="$(git -C frontend rev-parse --short HEAD)"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "frontend_hash=$FRONTEND_HASH" >> "$GITHUB_OUTPUT"
          echo "Version=$VERSION  Frontend=$FRONTEND_HASH"

      - name: Build and push staging images (${{ matrix.lineup }})
        if: env.SKIP != '1'
        uses: docker/bake-action@v7
        env:
          VERSION: ${{ steps.vars.outputs.version }}
          FRONTEND_HASH: ${{ steps.vars.outputs.frontend_hash }}
          STABLE_TAG: ${{ github.event.inputs.base_tag || 'stable' }}
          STABLE_TAG_ASCEND: ${{ github.event.inputs.base_tag_ascend }}
        with:
          files: |
            docker-bake.hcl
            docker-bake.staging.hcl
            ${{ github.event.inputs.skip_base == 'true' && 'docker-bake.skip-base.hcl' || '' }}
          targets: ${{ github.event.inputs.targets || matrix.lineup }}
          push: true

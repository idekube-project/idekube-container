name: publish-staging

# Builds and tests release candidates through _build.yml: native per-platform
# builds pushed by digest, merged onto the "-staging" tags, then tested
# (universal/amd64 gates; arm64 and ascend report). The pushed digests and the
# test outcome are recorded in candidate.json; for a release (prerelease
# event, or dispatch with `version`) it is attached to the GitHub release,
# and publish-production.yml promotes exactly those digests if tests passed.
#
#   push to main  -> VERSION=edge (edge-staging tags), keeps the cache warm
#   prerelease    -> VERSION=<release tag>
#   dispatch      -> VERSION=<version input> (checks that tag out) or short SHA

on:
  push:
    branches: [main]
  release:
    types: [prereleased]
  workflow_dispatch:
    inputs:
      version:
        description: "Release tag to build a candidate for (checks the tag out; candidate.json is attached to its release). Empty = current ref, versioned by short SHA."
        required: false
        type: string
        default: ""
      lineup:
        description: "universal, ascend, or both"
        required: false
        type: choice
        options: [universal, ascend, both]
        default: both
      targets:
        description: "Bake target/group (e.g. agent-base-ascend, agent-base-all, agent). Empty = full lineup. Run 'make discover GROUP=universal' to list targets."
        required: false
        type: string
        default: ""
      skip_base:
        description: "Skip base-image rebuild — derived targets pull :stable from the registry instead."
        required: false
        type: boolean
        default: false
      base_tag:
        description: "Universal base image tag when skip_base is enabled (e.g. stable, v0.8.3, edge-staging)."
        required: false
        type: string
        default: "stable"
      base_tag_ascend:
        description: "Ascend base image tag when skip_base is enabled. Empty = base_tag + '-ascend'."
        required: false
        type: string
        default: ""

# One candidate per release version at a time. Pushes to main share the edge
# tags, so a newer push cancels an older edge build.
concurrency:
  group: publish-staging-${{ github.event.release.tag_name || inputs.version || (github.event_name == 'push' && 'edge') || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

jobs:
  setup:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      ref: ${{ steps.vars.outputs.ref }}
      version: ${{ steps.vars.outputs.version }}
      lineups: ${{ steps.vars.outputs.lineups }}
    steps:
      - name: Resolve version and ref
        id: vars
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_LINEUP: ${{ inputs.lineup }}
          SHA: ${{ github.sha }}
        run: |
          ref=$SHA
          case "$EVENT_NAME" in
            release) version=$RELEASE_TAG ;;
            push)    version=edge ;;
            *)
              if [[ -n "$INPUT_VERSION" ]]; then
                version=$INPUT_VERSION
                ref=refs/tags/$INPUT_VERSION
              else
                version=${SHA::7}
              fi
              ;;
          esac
          # Docker tag grammar; also keeps odd release/tag names out of bake.
          if [[ ! "$version" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]]; then
            echo "::error::VERSION '$version' is not a valid image tag." >&2
            exit 1
          fi
          case "${INPUT_LINEUP:-both}" in
            both)      lineups=universal,ascend ;;
            universal) lineups=universal ;;
            ascend)    lineups=ascend ;;
            *) echo "::error::bad lineup '$INPUT_LINEUP'"; exit 1 ;;
          esac
          {
            echo "ref=$ref"
            echo "version=$version"
            echo "lineups=$lineups"
          } >> "$GITHUB_OUTPUT"
          echo "Building $version from $ref ($lineups)" >> "$GITHUB_STEP_SUMMARY"

  build:
    needs: setup
    uses: ./.github/workflows/_build.yml
    permissions:
      contents: read
      packages: write
    with:
      ref: ${{ needs.setup.outputs.ref }}
      version: ${{ needs.setup.outputs.version }}
      lineups: ${{ needs.setup.outputs.lineups }}
      targets: ${{ inputs.targets }}
      skip_base: ${{ inputs.skip_base == true }}
      base_tag: ${{ inputs.base_tag || 'stable' }}
      base_tag_ascend: ${{ inputs.base_tag_ascend }}
      cache_to: true
      artifact_prefix: staging

  # Attaches the final candidate.json (with the test outcome) to the release
  # and fails the run when the gating tests failed.
  publish-candidate:
    needs: [setup, build]
    if: always() && needs.build.outputs.tests != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write   # attach candidate.json to the release
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: staging-candidate
      - name: Attach candidate.json to the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.setup.outputs.version }}
          TESTS: ${{ needs.build.outputs.tests }}
        run: |
          if gh release view "$VERSION" >/dev/null 2>&1; then
            gh release upload "$VERSION" candidate.json --clobber
            echo "Attached candidate.json (tests $TESTS) to release $VERSION" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No release named $VERSION; candidate.json is only a workflow artifact." >> "$GITHUB_STEP_SUMMARY"
          fi
          [[ "$TESTS" == passed ]]

name: publish-staging

# Builds release candidates. Every image is pushed with the "-staging"
# postfix, and the digests that were pushed are recorded in candidate.json.
# For a release (prerelease event, or dispatch with `version`), candidate.json
# is attached to the GitHub release; publish-production.yml later promotes
# exactly those digests instead of rebuilding.

on:
  release:
    types: [prereleased]
  workflow_dispatch:
    inputs:
      version:
        description: "Release tag to build a candidate for (checks the tag out; candidate.json is attached to its release). Empty = current ref, versioned by short SHA."
        required: false
        type: string
        default: ""
      lineup:
        description: "universal, ascend, or both"
        required: false
        type: choice
        options: [universal, ascend, both]
        default: both
      targets:
        description: "Bake target/group (e.g. agent-base-ascend, agent-base-all, agent). Empty = full lineup. Run 'make discover GROUP=universal' to list targets."
        required: false
        type: string
        default: ""
      skip_base:
        description: "Skip base-image rebuild — derived targets pull :stable from the registry instead."
        required: false
        type: boolean
        default: false
      base_tag:
        description: "Universal base image tag when skip_base is enabled (e.g. stable, v0.8.3, edge-staging)."
        required: false
        type: string
        default: "stable"
      base_tag_ascend:
        description: "Ascend base image tag when skip_base is enabled. Empty = base_tag + '-ascend'."
        required: false
        type: string
        default: ""

# One candidate build per release version at a time; SHA-versioned dispatch
# builds do not share state and may run in parallel.
concurrency:
  group: publish-staging-${{ github.event.release.tag_name || inputs.version || github.run_id }}
  cancel-in-progress: false

jobs:
  publish:
    name: ${{ matrix.lineup }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        lineup: [universal, ascend]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # Empty on release events: the event's tag is checked out.
          ref: ${{ inputs.version }}
          submodules: recursive
          fetch-depth: 0

      # Matrix-leg routing:
      #   - targets set      -> run universal leg only (the default leg). The
      #                         job builds whatever the targets value resolves
      #                         to inside bake; the leg label is purely the
      #                         runner-job slot, not a filter on what's built.
      #                         Ascend images can still be produced when the
      #                         requested group contains ascend targets (e.g.
      #                         agent-ascend, agent-base-all).
      #   - targets empty    -> lineup input controls (both / universal / ascend).
      - name: Route matrix leg (targets overrides lineup)
        if: ${{ github.event_name == 'workflow_dispatch' && ( (github.event.inputs.targets != '' && matrix.lineup != 'universal') || (github.event.inputs.targets == '' && github.event.inputs.lineup != 'both' && github.event.inputs.lineup != matrix.lineup) ) }}
        env:
          LINEUP: ${{ matrix.lineup }}
          INPUT_TARGETS: ${{ github.event.inputs.targets }}
          INPUT_LINEUP: ${{ github.event.inputs.lineup }}
        run: |
          echo "Skipping ${LINEUP} (targets='${INPUT_TARGETS}', lineup='${INPUT_LINEUP}')"
          echo "SKIP=1" >> "$GITHUB_ENV"

      - name: Setup Docker build environment
        if: env.SKIP != '1'
        uses: ./.github/actions/setup-docker-buildx
        with:
          login: true
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Validates the dispatch inputs and picks the bake targets for this leg
      # (skip_base without targets -> <lineup>-derived; skip_base with targets
      # that still contain a base image -> error). See the script header.
      - name: Resolve bake targets
        id: plan
        if: env.SKIP != '1'
        env:
          MATRIX_LINEUP: ${{ matrix.lineup }}
          INPUT_TARGETS: ${{ github.event.inputs.targets }}
          SKIP_BASE: ${{ github.event.inputs.skip_base }}
          BASE_TAG: ${{ github.event.inputs.base_tag }}
          BASE_TAG_ASCEND: ${{ github.event.inputs.base_tag_ascend }}
          BAKE_OVERRIDE: docker-bake.staging.hcl
        run: ./scripts/ci-resolve-targets.sh

      - name: Resolve staging version
        id: vars
        if: env.SKIP != '1'
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [[ "$EVENT_NAME" == "release" ]]; then
            VERSION="$RELEASE_TAG"
          elif [[ -n "$INPUT_VERSION" ]]; then
            VERSION="$INPUT_VERSION"
          else
            VERSION="$(git rev-parse --short=7 HEAD)"
          fi

          # Docker tag grammar; also keeps odd release/tag names out of bake.
          if [[ ! "$VERSION" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]]; then
            echo "::error::VERSION '$VERSION' is not a valid image tag." >&2
            exit 1
          fi
          FRONTEND_HASH="$(./scripts/ci/frontend-hash.sh)"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "frontend_hash=$FRONTEND_HASH" >> "$GITHUB_OUTPUT"
          echo "Version=$VERSION  Frontend=$FRONTEND_HASH"

      - name: Build and push staging images (${{ matrix.lineup }})
        if: env.SKIP != '1'
        uses: docker/bake-action@59cb1203cd42bcefd40a1b6d73b589e48c86040e # v7.5.0
        env:
          VERSION: ${{ steps.vars.outputs.version }}
          FRONTEND_HASH: ${{ steps.vars.outputs.frontend_hash }}
          STABLE_TAG: ${{ github.event.inputs.base_tag || 'stable' }}
          STABLE_TAG_ASCEND: ${{ github.event.inputs.base_tag_ascend }}
        with:
          files: |
            docker-bake.hcl
            docker-bake.staging.hcl
            ${{ github.event.inputs.skip_base == 'true' && 'docker-bake.skip-base.hcl' || '' }}
          targets: ${{ steps.plan.outputs.targets }}
          push: true

      # Matrix job outputs keep only one leg's values, so each leg hands what
      # it built to the candidate job as an artifact.
      - name: Record what this leg built
        if: env.SKIP != '1'
        env:
          LINEUP: ${{ matrix.lineup }}
          VERSION: ${{ steps.vars.outputs.version }}
          TARGETS: ${{ steps.plan.outputs.targets }}
          SKIP_BASE: ${{ github.event.inputs.skip_base == 'true' }}
        run: |
          jq -n --arg version "$VERSION" --arg targets "$TARGETS" --arg skip_base "$SKIP_BASE" \
            --arg sha "$(git rev-parse HEAD)" \
            '{version: $version, targets: $targets, skip_base: ($skip_base == "true"), sha: $sha}' \
            > "plan-${LINEUP}.json"
          cat "plan-${LINEUP}.json"

      - name: Upload leg plan
        if: env.SKIP != '1'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: plan-${{ matrix.lineup }}
          path: plan-${{ matrix.lineup }}.json
          retention-days: 7

  # Runs only when every leg succeeded: a partial build is never a candidate.
  candidate:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write   # attach candidate.json to the release
      packages: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.version }}

      - name: Setup Docker build environment
        uses: ./.github/actions/setup-docker-buildx
        with:
          login: true
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: plan-*
          merge-multiple: true

      - name: Record candidate digests
        id: candidate
        env:
          CANDIDATE_SOURCE: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          version=$(jq -rs 'map(.version) | unique | if length == 1 then .[0] else error("legs disagree on version") end' plan-*.json)
          sha=$(jq -rs 'map(.sha) | unique | if length == 1 then .[0] else error("legs disagree on commit") end' plan-*.json)
          skip_base=$(jq -rs 'map(.skip_base) | unique | if length == 1 then .[0] else error("legs disagree on skip_base") end' plan-*.json)
          targets=$(jq -rs 'map(.targets | split(",")) | add | unique | join(",")' plan-*.json)
          [[ "$sha" == "$(git rev-parse HEAD)" ]] || { echo "::error::legs built $sha, checkout is $(git rev-parse HEAD)"; exit 1; }
          args=(candidate --version "$version" --sha "$sha" --targets "$targets" --out candidate.json)
          [[ "$skip_base" == true ]] && args+=(--skip-base)
          ./scripts/ci/bakeplan.py "${args[@]}"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: candidate
          path: candidate.json

      - name: Attach candidate.json to the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.candidate.outputs.version }}
        run: |
          if gh release view "$VERSION" >/dev/null 2>&1; then
            gh release upload "$VERSION" candidate.json --clobber
            echo "Attached candidate.json to release $VERSION" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No release named $VERSION; candidate.json is only a workflow artifact." >> "$GITHUB_STEP_SUMMARY"
          fi
